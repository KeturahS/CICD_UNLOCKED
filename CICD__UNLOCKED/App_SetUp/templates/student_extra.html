<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>פרטי סטודנט נוספים</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #e3f2fd, #ffffff);
      font-family: "Segoe UI", sans-serif;
    }

    .card {
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: none;
      background-color: #ffffff;
    }

    h3 {
      color: #0d47a1;
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
      color: #2c3e50;
    }

    .btn-primary {
      background-color: #1565c0;
      border: none;
      border-radius: 30px;
      padding: 10px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0d47a1;
    }

    a {
      text-decoration: none;
      color: #1565c0;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .alert {
      border-radius: 12px;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card mx-auto" style="max-width: 600px;">
      <h3 class="text-center mb-4">השלמת הרשמה לסטודנט</h3>

      {% if msg %}
        <div class="alert alert-danger text-center">{{ msg }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">מוסד לימודים</label>
          <select name="institution" class="form-select" required>
            <option value="">בחר מוסד לימודים</option>
            <option value="SCE">SCE - המכללה האקדמית להנדסה ע"ש סמי שמעון</option>
            <option value="TAU">אוניברסיטת תל אביב</option>
            <option value="HUJI">האוניברסיטה העברית בירושלים</option>
            <option value="TECH">הטכניון</option>
            <option value="BIU">אוניברסיטת בר אילן</option>
            <option value="BGU">אוניברסיטת בן גוריון</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">תאריך סיום משוער</label>
          <input type="date" name="target_completion_date" class="form-control" required>
        </div>

        <div class="mb-3 text-end">
          <a href="{% url 'terms' %}" target="_blank">קרא את תנאי השימוש</a>
        </div>

        <div class="form-check mb-4">
          <input type="checkbox" class="form-check-input" id="agree" required>
          <label class="form-check-label" for="agree">אני מאשר/ת את תנאי השימוש</label>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>הרשמה</button>
      </form>
    </div>
  </div>

  <script>
    const checkbox = document.getElementById('agree');
    const button = document.getElementById('submitBtn');
    checkbox.addEventListener('change', () => {
      button.disabled = !checkbox.checked;
    });
  </script>
</body>
</html>
