<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>פרטי סטודנט נוספים</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h3 class="text-center mb-4">השלמת הרשמה לסטודנט</h3>
      {% if msg %}
        <div class="alert alert-danger">{{ msg }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">מוסד לימודים</label>
          <input type="text" name="institution" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">תאריך סיום משוער</label>
          <input type="date" name="target_completion_date" class="form-control" required>
        </div>

        <div class="mb-3">
          <a href="{% url 'terms' %}" target="_blank">לחץ כאן לקרוא את תנאי השימוש</a>
        </div>

        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="agree" required>
          <label class="form-check-label" for="agree">אני מאשר/ת את תנאי השימוש</label>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>הרשמה</button>
      </form>
    </div>
  </div>

  <script>
    const checkbox = document.getElementById('agree');
    const button = document.getElementById('submitBtn');
    checkbox.addEventListener('change', () => {
      button.disabled = !checkbox.checked;
    });
  </script>
</body>
</html>
