<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title> ניהול עמוד שאלות ותשובות</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <style>
        body {
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: {{ background_color }};
            padding: 2rem;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        form {
            background: #ffffff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 20px;
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .exercise-box {
            border-bottom: 1px solid #ddd;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        #exercise-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 1rem;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }


    </style>
</head>
<body>

<h1>  ניהול עמוד שאלות ותשובות </h1>

<!-- טופס הוספת תרגיל חדש -->
<h2>➕ הוסף סט שאלה ותשובה חדש</h2>
<form method="POST">
    {% csrf_token %}

    <label for="question">שאלה</label>
    <input type="text" id="question" name="question" required>

    <label for="answer">תשובה</label>
    <input type="text" id="answer" name="answer" required>


    <br><br>
    <button type="submit" name="add_QA">הוסף שאלה ותשובה</button>
</form>



<!-- רשימת תרגילים קיימים -->
<h2>📋שאלות ותשובות קיימות</h2>
<div id="exercise-list">
    {% for faq in faqs %}
    <div class="exercise-box">
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="faq_id" value="{{ faq.id }}">

            <label>שאלה:</label>
            <textarea name="question"  rows="1" required>{{ faq.question }}</textarea>

            <label> תשובה:</label>
            <textarea name="answer" rows="3" required>{{ faq.answer }}</textarea>


            <button type="submit" name="update_QA">💾 עדכן</button>
            <button type="submit" name="delete_QA" onclick="return confirm('האם אתה בטוח שברצונך למחוק את השאלה והתשובה האלו?')">🗑 מחק</button>
        </form>
    </div>
    {% empty %}
        <p>אין שאלות ותשובות כרגע.</p>
    {% endfor %}
</div>


</body>
</html>
