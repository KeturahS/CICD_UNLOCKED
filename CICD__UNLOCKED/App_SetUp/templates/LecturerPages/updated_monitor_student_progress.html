<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח בקרה למרצה - מעקב התקדמות סטודנטים</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            direction: rtl;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            text-align: center;
            opacity: 0.8;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .search-box {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 300px;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .filter-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .student-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .student-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .student-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .student-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .student-info h3 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #00d4ff;
        }

        .student-info p {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .overall-progress {
            text-align: center;
            margin-bottom: 20px;
        }

        .overall-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            position: relative;
            background: conic-gradient(from 0deg, #00d4ff 0%, #00d4ff var(--progress), rgba(255,255,255,0.1) var(--progress), rgba(255,255,255,0.1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overall-circle::before {
            content: '';
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1a1a2e;
            position: absolute;
        }

        .overall-circle span {
            position: relative;
            z-index: 1;
            font-weight: bold;
            font-size: 1.1rem;
            color: #00d4ff;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .module-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .docker-icon { background: linear-gradient(45deg, #00d4ff, #0099cc); }
        .jenkins-icon { background: linear-gradient(45deg, #666, #888); }
        .git-icon { background: linear-gradient(45deg, #ff6b47, #ff4500); }

        .module-progress {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .docker-progress-text { color: #00d4ff; }
        .jenkins-progress-text { color: #888; }
        .git-progress-text { color: #ff6b47; }

        .module-name {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .module-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .stat-watched { color: #ffa500; }
        .stat-remaining { color: #00ff88; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detailed-modules {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detailed-module {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .docker-progress { background: linear-gradient(90deg, #00d4ff, #0099cc); }
        .jenkins-progress { background: linear-gradient(90deg, #666, #888); }
        .git-progress { background: linear-gradient(90deg, #ff6b47, #ff4500); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-number {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-number.watched { color: #ffa500; }
        .stat-number.remaining { color: #00ff88; }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .students-grid {
                grid-template-columns: 1fr;
                padding: 10px;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .search-box {
                min-width: 250px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
            }

            .send-btn {
                color: #00d4ff; /* Change this to your desired color */
                text-decoration: none; /* Optional: removes underline */
            }

            .send-btn:hover {
                color: #00d4ff; /* Optional: color on hover */
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>לוח בקרה למרצה</h1>
        <p>מעקב התקדמות כל הסטודנטים במערכת</p>
    </div>

    <div class="controls">
        <input type="text" class="search-box" placeholder="חיפוש סטודנט..." id="searchInput">
        <button class="filter-btn active" data-filter="all">כל הסטודנטים</button>
        <button class="filter-btn" data-filter="high">התקדמות גבוהה</button>
        <button class="filter-btn" data-filter="medium">התקדמות בינונית</button>
        <button class="filter-btn" data-filter="low">התקדמות נמוכה</button>
    </div>

    <div class="students-grid" id="studentsGrid">

        <!-- Students will be populated by JavaScript -->
    </div>

    <!-- Modal for detailed view -->
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalContent">
                <!-- Detailed student info will be populated here -->
            </div>
        </div>
    </div>

    <script>
        // Sample student data
        const studentsData = []
         {% for student in students %}
          studentsData.push({
            id: {{ student.id }},
            username: "{{ student.username }}",
            name: "{{ student.name }}",
            email: "{{ student.email }}",
            modules: {
                docker: { progress: {{ student.docker_general_progress }}, videosWatched: {{ student.docker_vids_completed }}, videosTotal: {{ student.docker_vids_total }}, presentationsViewed: {{ student.docker_presentations_completed }}, presentationsTotal: {{ student.docker_presentations_total }} },
                jenkins: { progress: {{ student.jenkins_general_progress }}, videosWatched: {{ student.jenkins_vids_completed }}, videosTotal: {{ student.jenkins_vids_total }}, presentationsViewed: {{ student.jenkins_presentations_completed }}, presentationsTotal: {{ student.jenkins_presentations_total }} },
                git: { progress: {{ student.git_general_progress }}, videosWatched: {{ student.git_vids_completed }}, videosTotal: {{ student.git_vids_total }}, presentationsViewed: {{ student.git_presentations_completed }}, presentationsTotal: {{ student.git_presentations_total }} }
            }
            });
            {% endfor %}


        function renderStudents(students = studentsData) {
            const grid = document.getElementById('studentsGrid');
            if (!students.length) {
                grid.innerHTML = '<p>לא נמצאו סטודנטים להצגה.</p>';
                return;
            }
            grid.innerHTML = students.map(createStudentCard).join('');
        }


        function calculateOverallProgress(modules) {
            const totalProgress = modules.docker.progress + modules.jenkins.progress + modules.git.progress;
            return Math.round(totalProgress / 3);
        }

        function getProgressCategory(progress) {
            if (progress >= 70) return 'high';
            if (progress >= 40) return 'medium';
            return 'low';
        }

        function getInitials(name) {
            return name.split(' ').map(word => word[0]).join('');
        }

        function createStudentCard(student) {
            const overallProgress = calculateOverallProgress(student.modules);
            const category = getProgressCategory(overallProgress);

            return `
                <div class="student-card" data-category="${category}" data-student-id="${student.id}" onclick="openStudentModal(${student.id})">
                    <div class="student-header">
                        <div class="student-info">
                            <h3>${student.name}</h3>
                           <h3>${student.email}</h3>

                          <a href="{% url 'send_private_message' %}?recipient={{ student.username }}" class="btn" style="color: white; font-size: 1rem; text-decoration: none; background-color: #00d4ff; padding: 10px 15px; border-radius: 5px; display: inline-block;">
                              שלח הודעה
                          </a>

                         </div>
                    </div>

                    <div class="overall-progress">
                        <div class="overall-circle" style="--progress: ${overallProgress}%">
                            <span>${overallProgress}%</span>
                        </div>
                        <p>התקדמות כללית</p>
                    </div>

                    <div class="modules-grid">
                        <div class="module-card">
                            <div class="module-icon docker-icon">🐳</div>
                            <div class="module-progress docker-progress-text">${student.modules.docker.progress}%</div>
                            <div class="module-name">Docker</div>
                            <div class="module-stats">
                                <span class="stat-watched">${student.modules.docker.videosWatched}</span>
                                <span class="stat-remaining">${student.modules.docker.presentationsViewed}</span>
                            </div>
                        </div>

                        <div class="module-card">
                            <div class="module-icon jenkins-icon">⚙️</div>
                            <div class="module-progress jenkins-progress-text">${student.modules.jenkins.progress}%</div>
                            <div class="module-name">Jenkins</div>
                            <div class="module-stats">
                                <span class="stat-watched">${student.modules.jenkins.videosWatched}</span>
                                <span class="stat-remaining">${student.modules.jenkins.presentationsViewed}</span>
                            </div>
                        </div>

                        <div class="module-card">
                            <div class="module-icon git-icon">📁</div>
                            <div class="module-progress git-progress-text">${student.modules.git.progress}%</div>
                            <div class="module-name">Git</div>
                            <div class="module-stats">
                                <span class="stat-watched">${student.modules.git.videosWatched}</span>
                                <span class="stat-remaining">${student.modules.git.presentationsViewed}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudents(students = studentsData) {
            const grid = document.getElementById('studentsGrid');
            grid.innerHTML = students.map(createStudentCard).join('');
        }

        function openStudentModal(studentId) {
            const student = studentsData.find(s => s.id === studentId);
            if (!student) return;

            const overallProgress = calculateOverallProgress(student.modules);

            const modalContent = `
                <div class="student-header">
                    <div class="student-info">
                        <h2>${student.name}</h2>
                        <p>${student.email}</p>

                    </div>
                </div>

                <div class="overall-progress">
                    <div class="overall-circle" style="--progress: ${overallProgress}%; width: 120px; height: 120px;">
                        <span style="font-size: 1.5rem;">${overallProgress}%</span>
                    </div>
                    <h3>התקדמות כללית</h3>
                </div>

                <div class="detailed-modules">
                    <div class="detailed-module">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                            <div class="module-icon docker-icon" style="width: 50px; height: 50px; font-size: 24px;">🐳</div>
                            <h3 style="color: #00d4ff;">Docker - קונטיינרים ופריסה</h3>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill docker-progress" style="width: ${student.modules.docker.progress}%"></div>
                        </div>
                        <p style="text-align: center; margin: 10px 0; font-size: 1.2rem; font-weight: bold; color: #00d4ff;">${student.modules.docker.progress}%</p>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-number watched">${student.modules.docker.videosWatched}</div>
                                <div class="stat-label">סרטונים נצפו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number remaining">${student.modules.docker.videosTotal - student.modules.docker.videosWatched}</div>
                                <div class="stat-label">סרטונים נותרו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number watched">${student.modules.docker.presentationsViewed}</div>
                                <div class="stat-label">מצגות נצפו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number remaining">${student.modules.docker.presentationsTotal - student.modules.docker.presentationsViewed}</div>
                                <div class="stat-label">מצגות נותרו</div>
                            </div>
                        </div>
                    </div>

                    <div class="detailed-module">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                            <div class="module-icon jenkins-icon" style="width: 50px; height: 50px; font-size: 24px;">⚙️</div>
                            <h3 style="color: #888;">Jenkins - אוטומציה CI/CD</h3>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill jenkins-progress" style="width: ${student.modules.jenkins.progress}%"></div>
                        </div>
                        <p style="text-align: center; margin: 10px 0; font-size: 1.2rem; font-weight: bold; color: #888;">${student.modules.jenkins.progress}%</p>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-number watched">${student.modules.jenkins.videosWatched}</div>
                                <div class="stat-label">סרטונים נצפו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number remaining">${student.modules.jenkins.videosTotal - student.modules.jenkins.videosWatched}</div>
                                <div class="stat-label">סרטונים נותרו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number watched">${student.modules.jenkins.presentationsViewed}</div>
                                <div class="stat-label">מצגות נצפו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number remaining">${student.modules.jenkins.presentationsTotal - student.modules.jenkins.presentationsViewed}</div>
                                <div class="stat-label">מצגות נותרו</div>
                            </div>
                        </div>
                    </div>

                    <div class="detailed-module">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                            <div class="module-icon git-icon" style="width: 50px; height: 50px; font-size: 24px;">📁</div>
                            <h3 style="color: #ff6b47;">Git - ניהול גרסאות וקוד</h3>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill git-progress" style="width: ${student.modules.git.progress}%"></div>
                        </div>
                        <p style="text-align: center; margin: 10px 0; font-size: 1.2rem; font-weight: bold; color: #ff6b47;">${student.modules.git.progress}%</p>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-number watched">${student.modules.git.videosWatched}</div>
                                <div class="stat-label">סרטונים נצפו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number remaining">${student.modules.git.videosTotal - student.modules.git.videosWatched}</div>
                                <div class="stat-label">סרטונים נותרו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number watched">${student.modules.git.presentationsViewed}</div>
                                <div class="stat-label">מצגות נצפו</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number remaining">${student.modules.git.presentationsTotal - student.modules.git.presentationsViewed}</div>
                                <div class="stat-label">מצגות נותרו</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = modalContent;
            document.getElementById('studentModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('studentModal').style.display = 'none';
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredStudents = studentsData.filter(student =>
                student.name.toLowerCase().includes(searchTerm) ||
                student.email.toLowerCase().includes(searchTerm)
            );
            renderStudents(filteredStudents);
        });

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active class from all buttons
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');

                const filter = this.dataset.filter;
                let filteredStudents = studentsData;

                if (filter !== 'all') {
                    filteredStudents = studentsData.filter(student => {
                        const overallProgress = calculateOverallProgress(student.modules);
                        const category = getProgressCategory(overallProgress);
                        return category === filter;
                    });
                }

                renderStudents(filteredStudents);
            });
        });

        // Close modal when clicking outside
        document.getElementById('studentModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initial render
        renderStudents();
    </script>
    <script>
        window.onload = function () {
            renderStudents();
        };
    </script>

</body>
</html>
