<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>ניהול תרגולי Git - מרצה</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
    <style>
        body {
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 2rem;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        form {
            background: #ffffff;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .exercise-box {
            border-bottom: 1px solid #ddd;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        #exercise-list {
            max-height: 300px;
            overflow-y: auto;
            padding: 1rem;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #search {
            margin-bottom: 1rem;
            padding: 0.5rem;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        #terminal {
            margin-top: 2rem;
            width: 100%;
            height: 300px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 1rem;
        }
    </style>
</head>
<body>

<h1>  בוחן בלומדת ג'נקינס </h1>

<!-- טופס הוספת תרגיל חדש -->
<h2>➕ הוסף שאלה נוספת</h2>
<form method="POST">

    {% csrf_token %}
    <label>שאלה</label>
    <textarea name="question" rows="2" required></textarea>
    <label>אפשרות 1</label>
    <textarea name="answer1" rows="2" required></textarea>
    <label>אפשרות 2</label>
    <textarea name="answer2" rows="2" required></textarea>
    <label>אפשרות 3</label>
    <textarea name="answer3" rows="2" required></textarea>
    <label>אפשרות 4</label>
    <textarea name="answer4" rows="2" required></textarea>
    <label>תשובה נכונה</label>
    <textarea name="correct_answer" rows="2" required></textarea>

    <button type="submit" name="add_question">➕ הוסף שאלה</button>

</form>



<!-- רשימת שאלות קיימות -->
<h2>📋 תרגילים קיימים</h2>
<div id="exercise-list">
    {% for question in JenkinsConceptsQuiz %}
    <div class="exercise-box">
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="question_id" value="{{ question.id }}">
            <label>שאלה:</label>
            <textarea name="question" rows="2" required>{{ question.question }}</textarea>
            <label>אפשרות 1:</label>
            <textarea name="answer1" rows="2" required>{{ question.option1 }}</textarea>
            <label>אפשרות 2:</label>
            <textarea name="answer2" rows="2" required>{{ question.option2 }}</textarea>
            <label>אפשרות 3:</label>
            <textarea name="answer3" rows="2" required>{{ question.option3 }}</textarea>
            <label>אפשרות 4:</label>
            <textarea name="answer4" rows="2" required>{{ question.option4 }}</textarea>
            <label>תשובה נכונה:</label>
            <textarea name="correct_answer" rows="2" required>{{ question.answer }}</textarea>
            <label>רמה:</label>



            <button type="submit" name="update_question">💾 עדכן</button>
            <button type="submit" name="delete_question" onclick="return confirm('האם אתה בטוח שברצונך למחוק שאלה זו?')">🗑 מחק</button>
        </form>
    </div>
    {% empty %}
        <p>אין בוחן כרגע.</p>
    {% endfor %}
</div>


</body>
</html>
