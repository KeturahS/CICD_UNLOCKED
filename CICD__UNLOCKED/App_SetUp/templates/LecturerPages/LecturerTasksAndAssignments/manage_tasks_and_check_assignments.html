<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tasks and Assignments</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .card {
            width: 180px;
            background: #ffffff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card a {
            color: #007bff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            z-index: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #007bff, #0056b3);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover::before {
            opacity: 0.8;
        }

        .card:hover a {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="{% url 'Lecturer_manage_git' %}">ניהול ענייני גיט Git</a>
        </div>
        <div class="card">
            <a href="{% url 'Lecturer_manage_docker' %}">ניהול ענייני דוקר Docker</a>
        </div>
        <div class="card">
            <a href="{% url 'Lecturer_manage_jenkins' %}">ניהול ענייני ג'נקינס Jenkins</a>
        </div>
    </div>
</body>
</html>
