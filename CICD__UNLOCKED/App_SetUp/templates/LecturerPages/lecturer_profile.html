<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>פרופיל מרצה</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: {{ background_color }};
            color: #333;
            direction: rtl;
            justify-content: center;
            text-align: right;
            min-height: 100vh;
            padding: 40px;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .profile-container {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 30px;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
        }

        p {
            margin: 12px 0;
            font-size: 16px;
        }

        strong {
            color: #2980b9;
        }

        .btn-back {
            background-color: #30f2f2;
            color: black;
            border: none;

            transition: background-color 0.3s ease;
        }
        .btn-back:hover {
            background-color: #20cfcf;
            color: black;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="profile-container">
            <h1>פרופיל מרצה</h1>

            {% if profile %}
                <p><strong>שם משתמש:</strong> {{ profile.user.username }}</p>
                <p><strong>שם פרטי:</strong> {{ profile.user.first_name }}</p>
                <p><strong>שם משפחה:</strong> {{ profile.user.last_name }}</p>
                <p><strong>אימייל:</strong> {{ profile.user.email }}</p>
            {% else %}
                <p>לא נמצא פרופיל מרצה.</p>
            {% endif %}
             <a href="{% url 'lecturer' %}" class="btn btn-primary mt-3 ms-2">חזרה לדף מרצה</a>
        </div>
    </div>

</body>
</html>
