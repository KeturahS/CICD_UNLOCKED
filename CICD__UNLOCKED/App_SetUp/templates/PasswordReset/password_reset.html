<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>איפוס סיסמה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(to bottom right, #e3f2fd, #ffffff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: rtl;
    }

    .reset-box {
      background-color: #fff;
      padding: 40px;
      max-width: 450px;
      width: 90%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
      border-top: 4px solid #1976d2;
    }

    h2 {
      color: #1976d2;
      margin-bottom: 20px;
    }

    p {
      color: #333;
      font-size: 16px;
      margin-bottom: 20px;
    }

    form {
      margin-top: 20px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: #1976d2;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body>

  <div class="reset-box">
    <h2>איפוס סיסמה</h2>
    <p>אנא הזן את כתובת האימייל שלך, ואנו נשלח לך קישור לאיפוס הסיסמה.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">שלח קישור לאיפוס</button>
    </form>
  </div>

</body>
</html>
