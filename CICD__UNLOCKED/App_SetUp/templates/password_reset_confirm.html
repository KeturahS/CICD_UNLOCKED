<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>הגדרת סיסמה חדשה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(to bottom right, #e3f2fd, #ffffff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: rtl;
    }

    .form-container {
      background-color: #fff;
      padding: 40px;
      max-width: 450px;
      width: 90%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      border-top: 4px solid #1976d2;
    }

    h2 {
      color: #0d47a1;
      text-align: center;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      color: #333;
    }

    input {
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 25px;
      background-color: #1976d2;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>בחר סיסמה חדשה</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">שמור סיסמה חדשה</button>
    </form>
  </div>

</body>
</html>
