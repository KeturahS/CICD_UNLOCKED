<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הודעה נשלחה</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(22, 163, 74, 0.2));
            border: 2px solid rgba(34, 197, 94, 0.3);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h4 {
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            color: #e2e8f0;
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #00d4ff);
            border: none;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00d4ff, #06b6d4);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            color: white;
            text-decoration: none;
        }

        .mt-3 {
            margin-top: 20px;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="alert alert-success">
            <div class="success-icon">✅</div>
            <h4>ההודעה נשלחה בהצלחה!</h4>
            <p>ההודעה נשלחה ל {{ student_name }}</p>
            <a href="/" class="btn btn-primary mt-3">חזור לדף הבית</a>
        </div>
    </div>
</body>
</html>
