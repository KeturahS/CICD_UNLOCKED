{% extends 'base.html' %}

{% block title %}שליחת הודעה לאדמין{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <h2 class="mb-4 text-center">📩 שליחת הודעה לאדמין</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="text-center">
            <button type="submit" class="btn btn-primary mt-3">שלח הודעה</button>
        </div>
    </form>
</div>
{% endblock %}
