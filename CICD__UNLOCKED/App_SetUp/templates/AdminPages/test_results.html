<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>תוצאות בדיקות</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #0a0e1a;
            color: white;
            font-family: 'Assistant', sans-serif;
        }

        /* סרגל עליון */
        .navbar-custom {
            background: linear-gradient(to right, #004b93, #6c1cb1);
            padding: 12px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .navbar-custom a {
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .navbar-custom a:hover {
            color: #00f6ff;
        }

        /* תוכן */
        .results-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .results-title {
            color: #00f6ff;
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(0, 246, 255, 0.15);
        }

        .results-output {
            background-color: #1c2333;
            color: #e2e6f3;
            padding: 20px;
            border-radius: 16px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        }

        .back-btn {
            background: linear-gradient(to right, #004b93, #6c1cb1);
            color: white;
            padding: 12px 35px;
            font-size: 1rem;
            border-radius: 30px;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 28, 177, 0.5);
            text-decoration: none;
        }

        .back-btn:hover {
            background: linear-gradient(to right, #0069c2, #7f2de5);
            box-shadow: 0 6px 18px rgba(108, 28, 177, 0.7);
            color: white;
        }
    </style>
</head>
<body>

<!-- סרגל עליון -->
<div class="navbar-custom">
    <a href="{% url 'admin' %}">🔙 חזרה לדף ניהול</a>
</div>

<!-- תוכן תוצאות -->
<div class="results-container">
    <h2 class="results-title">📋 תוצאות בדיקות אוטומטיות</h2>
    {% if status_message %}
        <div class="alert alert-{{ status_type }} text-center fw-bold">
            {{ status_message }}
        </div>
    {% endif %}
    <pre class="results-output">
{{ output }}
    </pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
