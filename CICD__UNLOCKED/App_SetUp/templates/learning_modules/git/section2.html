<section id="section2" style="padding: 30px; max-width: 900px; margin: auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.1);">
  <h2>{{ video.title }}</h2>
  <p style="font-size: 1.1em;">
    {{ video.description }}
  </p>

  <div id="player"></div>

  <!-- שאלה ראשונה -->
  <div id="question1" style="display:none; margin-top: 20px;">
    <p>מה עושה הפקודה <code>git init</code>?</p>
    <input type="radio" name="q1" value="a"> יוצרת עותק מרוחק של הפרויקט<br>
    <input type="radio" name="q1" value="b"> יוצרת מאגר Git חדש בתיקייה<br>
    <input type="radio" name="q1" value="c"> בודקת סטטוס הקבצים<br><br>
    <button onclick="checkAnswer('q1', 'b', 'feedback1')">בדוק תשובה</button>
    <div id="feedback1" style="display:none;"></div>
    <button id="resume1" onclick="resumeVideo('question1', 'feedback1', 'resume1')" style="display:none;">המשך צפייה</button>
  </div>

  <!-- שאלה שנייה -->
  <div id="question2" style="display:none; margin-top: 20px;">
    <p>מתי משתמשים בפקודה <code>git add</code>?</p>
    <input type="radio" name="q2" value="a"> לאחר יצירת מאגר<br>
    <input type="radio" name="q2" value="b"> כדי לשמור שינויים על הקוד<br>
    <input type="radio" name="q2" value="c"> כדי להכין קבצים לקומיט<br><br>
    <button onclick="checkAnswer('q2', 'c', 'feedback2')">בדוק תשובה</button>
    <div id="feedback2" style="display:none;"></div>
    <button id="resume2" onclick="resumeVideo('question2', 'feedback2', 'resume2')" style="display:none;">המשך צפייה</button>
  </div>

  <div style="margin-top: 30px; text-align: left;">
    <a href="?step=2q" class="btn-next">👉 עבור לשאלות נוספות בנושא</a>
  </div>
</section>

<!-- סקריפט YouTube -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
  const videoIdFromDB = "{{ video.youtube_id }}";

  let player;
  let interval = null;
  let question1Shown = false;
  let question2Shown = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '360',
      width: '640',
      videoId: videoIdFromDB,
      events: { 'onStateChange': onPlayerStateChange }
    });
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING && !interval) {
      interval = setInterval(() => {
        const time = Math.floor(player.getCurrentTime());

        if (time >= 255 && !question1Shown) {
          exitFullscreenIfNeeded();
          player.pauseVideo();
          document.getElementById('question1').style.display = 'block';
          question1Shown = true;
        }

        if (time >= 780 && !question2Shown) {
          exitFullscreenIfNeeded();
          player.pauseVideo();
          document.getElementById('question2').style.display = 'block';
          question2Shown = true;
        }

        if (question1Shown && question2Shown) {
          clearInterval(interval);
          interval = null;
        }
      }, 1000);
    }

    if (e.data === YT.PlayerState.PAUSED && interval) {
      clearInterval(interval);
      interval = null;
    }
  }

  function exitFullscreenIfNeeded() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function checkAnswer(qName, correctVal, feedbackId) {
    const selected = Array.from(document.getElementsByName(qName)).find(r => r.checked);
    const feedback = document.getElementById(feedbackId);
    if (!selected) {
      feedback.innerText = "אנא בחר תשובה";
    } else if (selected.value === correctVal) {
      feedback.innerHTML = "<span style='color:green'>✅ תשובה נכונה!</span>";
    } else {
      feedback.innerHTML = "<span style='color:red'>❌ תשובה שגויה.</span> " + getExplanation(qName);
    }
    feedback.style.display = 'block';
    document.getElementById('resume' + qName[qName.length - 1]).style.display = 'inline-block';
  }

  function resumeVideo(qDivId, fbId, btnId) {
    document.getElementById(qDivId).style.display = 'none';
    document.getElementById(fbId).style.display = 'none';
    document.getElementById(btnId).style.display = 'none';
    player.playVideo();
  }

  function getExplanation(qName) {
    switch (qName) {
      case 'q1': return "הפקודה git init יוצרת מאגר גרסאות חדש בתיקייה המקומית.";
      case 'q2': return "git add מוסיפה קבצים ל־staging area לפני שמבצעים commit.";
      default: return "";
    }
  }

  window.addEventListener('pageshow', function () {
    if (!document.getElementById('player')?.hasChildNodes()) {
      onYouTubeIframeAPIReady();
    }
  });
</script>
