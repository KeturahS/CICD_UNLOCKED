<section id="presentation-wrapper" aria-labelledby="presentation-title"
         style="text-align: center; padding: 40px 30px; background-color: #1e1e1e; color: #ffffff; border-radius: 16px; box-shadow: 0 0 30px rgba(0,0,0,0.4); max-width: 1000px; margin: auto; font-family: 'Segoe UI', sans-serif;">

  <h2 id="presentation-title" tabindex="0" style="font-size: 2em; margin-bottom: 20px;">
    📑 מצגת: פקודות מתקדמות ב־Git
  </h2>

  <div style="position: relative;" role="region" aria-label="מצגת מוטמעת של Google Slides">
    <iframe
      id="slideFrame"
      src="{{ presentation.embed_url }}&rm=minimal"
      width="100%" height="500px"
      frameborder="0"
      allowfullscreen
      title="מצגת פקודות מתקדמות"
      aria-label="שקופיות מצגת"
      style="border-radius: 8px;"
    ></iframe>

    <!-- כפתורי שליטה -->
    <div style="margin-top: 24px;" role="group" aria-label="שליטה במצגת">
      <button onclick="prevSlide()" class="btn-nav" aria-label="שקופית קודמת">◀️ קודם</button>
      <button onclick="nextSlide()" class="btn-nav" aria-label="שקופית הבאה">▶️ הבא</button>
      <button onclick="toggleFullscreen()" class="btn-nav" aria-label="מצב מסך מלא">⛶ מסך מלא</button>
    </div>
  </div>

  <!-- כפתור מעבר לשאלות -->
  <div id="questions-btn" style="margin-top: 35px; display: none;" role="region" aria-label="מעבר לשאלות">
    <a href="/learning/{% if request.GET.accessible %}&accessible=1{% endif %}"
       class="btn-next"
       role="button"
       aria-label="עבור לשאלות בנושא פקודות מתקדמות">
      כל הכבוד סיימת את הלומדה! לחץ למעבר ללומדות נוספות
    </a>
  </div>
</section>

<style>
  .btn-nav {
    background-color: #007acc;
    color: white;
    padding: 12px 20px;
    margin: 0 8px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .btn-nav:hover,
  .btn-nav:focus {
    background-color: #005fa3;
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }

  .btn-next {
    background-color: #00cc88;
    color: white;
    padding: 14px 26px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
  }

  .btn-next:hover,
  .btn-next:focus {
    background-color: #009e6e;
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
</style>

<script>
  let currentSlide = 0;
  const totalSlides = 9; // 🔢 שנה אם יש פחות/יותר שקופיות

  function updateIframe() {
    const iframe = document.getElementById('slideFrame');
    const baseUrl = "{{ presentation.embed_url|cut:'?start=false&loop=false&delayms=3000' }}";
    iframe.src = `${baseUrl}?start=false&loop=false&delayms=3000&slide=${currentSlide}`;
  }

  function nextSlide() {
    if (currentSlide < totalSlides - 1) {
      currentSlide++;
      updateIframe();
    }

    if (currentSlide === totalSlides - 1) {
      document.getElementById('questions-btn').style.display = 'block';
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      updateIframe();
    }
  }

  function toggleFullscreen() {
    const iframe = document.getElementById('slideFrame');
    if (iframe.requestFullscreen) iframe.requestFullscreen();
    else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
    else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
  }

  // תמיכה במקלדת ⌨️
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });
</script>
