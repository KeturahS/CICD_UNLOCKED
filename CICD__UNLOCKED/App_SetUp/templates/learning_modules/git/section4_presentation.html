<div id="presentation-wrapper"
     style="text-align: center; padding: 40px 25px; background-color: #ffffff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; font-family: 'Segoe UI', sans-serif;">

    <h2 style="margin-bottom: 20px; font-size: 2em; color: #333;">📑 מצגת: פקודות מתקדמות ב־Git</h2>
    <label class="completed-checkbox-label">
        <input type="checkbox" id="completedP-checkbox"
               {% if PresentationCompleted %}checked{% endif %}
               onchange="togglePresentationCompleted({{ presentation.id }})">
        השלמתי את המצגת
    </label>

    <!-- המצגת -->
    <div role="region" aria-label="מצגת מוטמעת על פקודות מתקדמות"
         style="position: relative; border-radius: 12px; overflow: hidden;">
        <iframe
                id="slideFrame"
                src="{{ presentation.embed_url }}&rm=minimal"
                width="100%"
                height="500px"
                frameborder="0"
                allowfullscreen
                title="מצגת אינטראקטיבית"
                aria-label="שקופיות בנושא פקודות מתקדמות"
                style="border: none;"
        ></iframe>

        <!-- כפתורי שליטה -->
        <div style="margin-top: 25px;" role="group" aria-label="שליטה במצגת">
            <button onclick="prevSlide()" class="btn-nav" aria-label="שקופית קודמת">◀️ קודם</button>
            <button onclick="nextSlide()" class="btn-nav" aria-label="שקופית הבאה">▶️ הבא</button>
            <button onclick="toggleFullscreen()" class="btn-nav" aria-label="הצגת מצגת במסך מלא">⛶ מסך מלא</button>
        </div>
    </div>

    <!-- כפתור מעבר לשאלות -->
    <div id="questions-btn" style="margin-top: 40px; display: none;" role="region"
         aria-label="מעבר לשאלות על פקודות מתקדמות">
        <a href="/learning/{% if request.GET.accessible %}?accessible=1{% endif %}"
           class="btn-next"
           role="button"
           aria-label="עבור לשאלות בנושא פקודות מתקדמות">
            כל הכבוד סיימת את הלומדה! לחץ למעבר לעמוד הלומדות
        </a>
    </div>
</div>

<style>
    .btn-nav {
      background-color: #007acc;
      color: #ffffff;
      padding: 12px 22px;
      margin: 0 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    .btn-nav:hover,
    .btn-nav:focus {
      background-color: #005fa3;
      outline: 2px solid #ffffff;
      outline-offset: 2px;
      transform: scale(1.03);
    }

    .btn-next {
      background-color: #00cc88;
      color: #ffffff;
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    .btn-next:hover,
    .btn-next:focus {
      background-color: #009e6e;
      outline: 2px solid #ffffff;
      outline-offset: 2px;
      transform: scale(1.03);
    }

    @media (max-width: 600px) {
      .btn-nav,
      .btn-next {
        display: block;
        width: 90%;
        margin: 10px auto;
        font-size: 16px;
      }
    }



  .completed-checkbox-label {
    display: flex;
    align-items: center;
    font-size: 1.2em;
    color: #2d3748;
    cursor: pointer;
    user-select: none;
    gap: 10px;
    padding: 10px 15px;
    border-radius: 8px;
    border: 2px solid #718096;
    transition: all 0.3s ease;
    background-color: #edf2f7;
  }

  .completed-checkbox-label:hover {
    background-color: #e2e8f0;
  }

  .completed-checkbox-label input[type="checkbox"] {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid #718096;
    border-radius: 4px;
    background-color: white;
    position: relative;
    transition: background-color 0.3s;
  }

  .completed-checkbox-label input[type="checkbox"]:checked {
    background-color: #48bb78;
    border-color: #48bb78;
  }

  .completed-checkbox-label input[type="checkbox"]::after {
    content: '✔';
    color: white;
    position: absolute;
    top: 0;
    left: 5px;
    font-size: 18px;
    display: none;
  }

  .completed-checkbox-label input[type="checkbox"]:checked::after {
    display: block;
  }


</style>

<script>
    let currentSlide = 0;
    const totalSlides = 9; // ⚠️ עדכן בהתאם למספר השקופיות שלך

    function updateIframe() {
      const iframe = document.getElementById('slideFrame');
      const baseUrl = "{{ presentation.embed_url|cut:'?start=false&loop=false&delayms=3000' }}";
      iframe.src = `${baseUrl}?start=false&loop=false&delayms=3000&slide=${currentSlide}`;
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateIframe();
      }

      if (currentSlide === totalSlides - 1) {
        document.getElementById('questions-btn').style.display = 'block';
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateIframe();
      }
    }

    function toggleFullscreen() {
      const iframe = document.getElementById('slideFrame');
      if (iframe.requestFullscreen) iframe.requestFullscreen();
      else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
      else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
      else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
    }

    // שליטה דרך מקשי חצים ← →
    document.addEventListener('keydown', function (e) {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });
</script>


<script>
    function togglePresentationCompleted(presentationId) {
      const checkbox = document.getElementById('completedP-checkbox');
      const isChecked = checkbox.checked;

      fetch(`/toggle-presentation-completion/${presentationId}/`, {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken(),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ presentation_completed: isChecked })
      })
      .then(response => {
        if (!response.ok) throw new Error("Request failed");
        return response.json();
      })
      .then(data => {
        console.log('Updated:', data);
      })
      .catch(error => {
        console.error('Error:', error);
        // במקרה של שגיאה – להחזיר את המצב לקודם
        checkbox.checked = !isChecked;
      });
    }

    function getCSRFToken() {
      return document.cookie.split('; ')
        .find(row => row.startsWith('csrftoken='))
        ?.split('=')[1];
    }
</script>
