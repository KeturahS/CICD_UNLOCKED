<section id="presentation-wrapper" aria-labelledby="docker-presentation-title"
         style="text-align: center; padding: 30px; background-color: #1e1e1e; color: #ffffff; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.3); max-width: 1000px; margin: auto;">
  <h2 id="docker-presentation-title" tabindex="0" style="margin-bottom: 20px;">📑 מצגת: Docker - מבוא וכלים בסיסיים</h2>

  <!-- מצגת מוטמעת -->
  <div role="region" aria-label="מצגת מוטמעת בנושא Docker" style="position: relative;">
    <iframe
      id="slideFrame"
      src="{{ presentation.embed_url }}&rm=minimal"
      width="100%"
      height="500px"
      frameborder="0"
      allowfullscreen
      title="מצגת אינטראקטיבית על Docker"
      aria-label="שקופיות בנושא Docker"
    ></iframe>

    <!-- כפתורי ניווט -->
    <div style="margin-top: 20px;" role="group" aria-label="שליטה במצגת">
      <button onclick="prevSlide()" class="btn-nav" aria-label="שקופית קודמת">◀️ קודם</button>
      <button onclick="nextSlide()" class="btn-nav" aria-label="שקופית הבאה">▶️ הבא</button>
      <button onclick="toggleFullscreen()" class="btn-nav" aria-label="מסך מלא למצגת">⛶ מסך מלא</button>
    </div>
  </div>

  <!-- כפתור מעבר לשאלות -->
  <div id="questions-btn" style="margin-top: 30px; display: none;" role="region" aria-label="מעבר לשאלות">
    <a href="?step=3q{% if request.GET.accessible %}&accessible=1{% endif %}"
       class="btn-next"
       role="button"
       aria-label="עבור לשאלות בנושא Docker">
      ✅ עבור לשאלות בנושא Docker
    </a>
  </div>
</section>

<!-- עיצוב נגיש -->
<style>
  .btn-nav {
    background-color: #007acc;
    color: #ffffff;
    padding: 12px 20px;
    margin: 0 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .btn-nav:hover,
  .btn-nav:focus {
    background-color: #005fa3;
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }

  .btn-next {
    background-color: #00cc88;
    color: #ffffff;
    padding: 14px 26px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
  }

  .btn-next:hover,
  .btn-next:focus {
    background-color: #009e6e;
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
</style>

<!-- לוגיקת ניווט -->
<script>
  let currentSlide = 0;
  const totalSlides = 7; // ⚠️ שנה בהתאם למספר השקופיות

  function updateIframe() {
    const iframe = document.getElementById('slideFrame');
    const baseUrl = "{{ presentation.embed_url|cut:'?start=false&loop=false&delayms=3000' }}";
    iframe.src = baseUrl + `?start=false&loop=false&delayms=3000&slide=${currentSlide}`;
  }

  function nextSlide() {
    if (currentSlide < totalSlides - 1) {
      currentSlide++;
      updateIframe();
    }

    if (currentSlide === totalSlides - 1) {
      document.getElementById('questions-btn').style.display = 'block';
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      updateIframe();
    }
  }

  function toggleFullscreen() {
    const iframe = document.getElementById('slideFrame');
    if (iframe.requestFullscreen) iframe.requestFullscreen();
    else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
    else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
  }

  // תמיכה בנגישות דרך מקלדת (לדפדפנים ישנים)
  document.addEventListener('keydown', function (e) {
    if (e.key === "ArrowRight") nextSlide();
    if (e.key === "ArrowLeft") prevSlide();
  });
</script>
