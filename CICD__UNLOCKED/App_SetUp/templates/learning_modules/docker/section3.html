<section id="presentation-wrapper" aria-labelledby="docker-presentation-title"
         style="text-align: center; padding: 30px; background-color: #f9f9f9; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; color: #000;">
  <h2 id="docker-presentation-title" tabindex="0" style="margin-bottom: 20px;">📑 מצגת: Docker - מבוא וכלים בסיסיים</h2>

  <!-- מצגת מוטמעת -->
  <div style="position: relative;">
    <iframe
      id="slideFrame"
      src="{{ presentation.embed_url }}&rm=minimal"
      width="100%"
      height="500px"
      frameborder="0"
      allowfullscreen
      title="מצגת Docker"
      aria-label="מצגת מוטמעת על Docker"
    ></iframe>

    <!-- כפתורי ניווט -->
    <div style="margin-top: 20px;">
      <button onclick="prevSlide()" class="btn-nav" aria-label="שקופית קודמת">◀️ קודם</button>
      <button onclick="nextSlide()" class="btn-nav" aria-label="שקופית הבאה">▶️ הבא</button>
      <button onclick="toggleFullscreen()" class="btn-nav" aria-label="הצג מסך מלא">⛶ מסך מלא</button>
    </div>
  </div>

  <!-- כפתור מעבר לשאלות -->
  <div id="questions-btn" style="margin-top: 30px; display: none;">
    <a href="?step=3q{% if request.GET.accessible %}&accessible=1{% endif %}" class="btn-next" role="button" aria-label="מעבר לשאלות">
      ✅ עבור לשאלות בנושא Docker
    </a>
  </div>
</section>

<style>
  .btn-nav {
    background-color: #007acc;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    margin: 0 10px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .btn-nav:hover {
    background-color: #005fa3;
  }

  .btn-next {
    background-color: #00cc88;
    color: white;
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
  }

  .btn-next:hover {
    background-color: #009e6e;
  }
</style>

<script>
  let currentSlide = 0;
  const totalSlides = 8;

  function updateIframe() {
    const iframe = document.getElementById('slideFrame');
    const baseUrl = "{{ presentation.embed_url|cut:'?start=false&loop=false&delayms=3000' }}";
    iframe.src = `${baseUrl}?start=false&loop=false&delayms=3000&slide=${currentSlide}`;
  }

  function nextSlide() {
    if (currentSlide < totalSlides - 1) {
      currentSlide++;
      updateIframe();
    }
    if (currentSlide === totalSlides - 1) {
      document.getElementById('questions-btn').style.display = 'block';
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      updateIframe();
    }
  }

  function toggleFullscreen() {
    const iframe = document.getElementById('slideFrame');
    if (iframe.requestFullscreen) iframe.requestFullscreen();
    else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
    else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
  }
</script>
