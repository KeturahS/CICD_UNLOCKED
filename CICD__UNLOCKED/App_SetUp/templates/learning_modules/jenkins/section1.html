<section id="section1" style="padding: 30px; max-width: 900px; margin: auto; background-color: #1e1e1e; color: #ffffff; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.4); font-family: Arial, sans-serif;">
 <div style="display: flex; flex-direction: row-reverse; align-items: center; gap: 130px;">
   <style>
  .completed-checkbox-label {
    display: flex;
    align-items: center;
    font-size: 1.2em;
    color: #2d3748;
    cursor: pointer;
    user-select: none;
    gap: 10px;
    padding: 10px 15px;
    border-radius: 8px;
    border: 2px solid #718096;
    transition: all 0.3s ease;
    background-color: #edf2f7;
  }

  .completed-checkbox-label:hover {
    background-color: #e2e8f0;
  }

  .completed-checkbox-label input[type="checkbox"] {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid #718096;
    border-radius: 4px;
    background-color: white;
    position: relative;
    transition: background-color 0.3s;
  }

  .completed-checkbox-label input[type="checkbox"]:checked {
    background-color: #48bb78;
    border-color: #48bb78;
  }

  .completed-checkbox-label input[type="checkbox"]::after {
    content: '✔';
    color: white;
    position: absolute;
    top: 0;
    left: 5px;
    font-size: 18px;
    display: none;
  }

  .completed-checkbox-label input[type="checkbox"]:checked::after {
    display: block;
  }
</style>

<label class="completed-checkbox-label">
  <input type="checkbox" id="completed-checkbox"
         {% if completed %}checked{% endif %}
         onchange="toggleCompleted({{ video.id }})">
  השלמתי את הסרטון
</label>



      <div>
        <h2 style="font-size: 2em; margin-bottom: 10px;">{{ video.title }}</h2>
        <p style="font-size: 1.1em; color: #555;">{{ video.description }}</p>
      </div>




 </div>



  {% if podcasts %}
  <div id="podcast-block" style="margin: 30px 0;">
    <button onclick="togglePodcast()" style="background-color: #00cc88; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
      🎧 פתח פודקאסט בנושא זה
    </button>
    <div id="podcast-player" style="display:none; margin-top: 20px;">
      <audio controls style="width: 100%;">
        <source src="{{ podcasts.0.audio_file.url }}" type="audio/wav">
        הדפדפן שלך לא תומך בניגון אודיו.
      </audio>
      <div style="margin-top: 10px;">
        <a href="{{ podcasts.0.audio_file.url }}" download style="text-decoration: none; background-color: #4CAF50; color: white; padding: 8px 16px; border-radius: 5px;">
          ⬇️ הורד פודקאסט
        </a>
      </div>
    </div>
  </div>
  {% endif %}

  <!-- נגן YouTube -->
  <div id="player" style="margin-bottom: 20px;"></div>

  <!-- שאלה 1 -->
  <div id="question1" class="question-box" style="display:none; background-color: #2c2c2c; padding: 20px; border-radius: 10px; margin-top: 20px;">
    <p style="font-weight: bold;">מה זה Jenkins?</p>
    <label><input type="radio" name="q1" value="a"> כלי לניהול קוד מקור כמו Git</label><br>
    <label><input type="radio" name="q1" value="b"> מערכת לאוטומציה של תהליכי פיתוח ותצורה (CI/CD)</label><br>
    <label><input type="radio" name="q1" value="c"> מערכת ענן לאחסון פרויקטים</label><br><br>
    <button onclick="checkAnswer('q1', 'b', 'feedback1')" style="background-color:#007acc; color:white; padding: 8px 16px; border: none; border-radius: 6px;">בדוק תשובה</button>
    <div id="feedback1" style="margin-top: 10px;"></div>
    <button id="resume1" onclick="resumeVideo('question1', 'feedback1', 'resume1')" style="display:none; margin-top: 10px; background-color: #00cc88; color: white; padding: 8px 16px; border: none; border-radius: 6px;">המשך צפייה</button>
  </div>

  <!-- שאלה 2 -->
  <div id="question2" class="question-box" style="display:none; background-color: #2c2c2c; padding: 20px; border-radius: 10px; margin-top: 20px;">
    <p style="font-weight: bold;">למה חשוב להשתמש ב-Jenkins בפרויקט תוכנה?</p>
    <label><input type="radio" name="q2" value="a"> כדי לאחסן את הקוד בגיבוי</label><br>
    <label><input type="radio" name="q2" value="b"> כדי להריץ בדיקות, לבנות קוד ולבצע דיפלוי בצורה אוטומטית</label><br>
    <label><input type="radio" name="q2" value="c"> כדי לעקוב אחרי באגים</label><br><br>
    <button onclick="checkAnswer('q2', 'b', 'feedback2')" style="background-color:#007acc; color:white; padding: 8px 16px; border: none; border-radius: 6px;">בדוק תשובה</button>
    <div id="feedback2" style="margin-top: 10px;"></div>
    <button id="resume2" onclick="resumeVideo('question2', 'feedback2', 'resume2')" style="display:none; margin-top: 10px; background-color: #00cc88; color: white; padding: 8px 16px; border: none; border-radius: 6px;">המשך צפייה</button>
  </div>

  <!-- כפתור מעבר -->
  <div style="margin-top: 30px; text-align: left;">
    <a href="?step=2" class="btn-next" style="background-color:#00cc88; color:#fff; padding:10px 20px; border-radius:6px; text-decoration:none;">👉 מעבר לסרטון הבא</a>
  </div>
</section>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const videoIdFromDB = "{{ video.youtube_id }}";
  let player;
  let interval = null;
  let question1Shown = false;
  let question2Shown = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '360',
      width: '640',
      videoId: videoIdFromDB,
      events: { 'onStateChange': onPlayerStateChange }
    });
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING && !interval) {
      interval = setInterval(() => {
        const time = Math.floor(player.getCurrentTime());
        if (time >= 120 && !question1Shown) {
          exitFullscreen();
          player.pauseVideo();
          document.getElementById('question1').style.display = 'block';
          question1Shown = true;
        }
        if (time >= 240 && !question2Shown) {
          exitFullscreen();
          player.pauseVideo();
          document.getElementById('question2').style.display = 'block';
          question2Shown = true;
        }
        if (question1Shown && question2Shown) {
          clearInterval(interval);
          interval = null;
        }
      }, 1000);
    }
    if (e.data === YT.PlayerState.PAUSED && interval) {
      clearInterval(interval);
      interval = null;
    }
  }

  function exitFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function checkAnswer(qName, correctVal, feedbackId) {
    const selected = Array.from(document.getElementsByName(qName)).find(r => r.checked);
    const feedback = document.getElementById(feedbackId);
    if (!selected) {
      feedback.innerText = "אנא בחר תשובה";
    } else if (selected.value === correctVal) {
      feedback.innerHTML = "<span style='color:green'>✅ תשובה נכונה!</span>";
    } else {
      feedback.innerHTML = "<span style='color:red'>❌ תשובה שגויה.</span> " + getExplanation(qName);
    }
    feedback.style.display = 'block';
    document.getElementById('resume' + qName[qName.length - 1]).style.display = 'inline-block';
  }

  function resumeVideo(qDivId, fbId, btnId) {
    document.getElementById(qDivId).style.display = 'none';
    document.getElementById(fbId).style.display = 'none';
    document.getElementById(btnId).style.display = 'none';
    player.playVideo();
  }

  function getExplanation(qName) {
    switch (qName) {
      case 'q1': return "Jenkins הוא כלי לאוטומציה של תהליכי פיתוח כמו בנייה, בדיקות ודיפלוי.";
      case 'q2': return "שימוש ב־Jenkins מאפשר חיסכון בזמן ודיוק בתהליך ה־CI/CD.";
      default: return "";
    }
  }

  function togglePodcast() {
    const playerDiv = document.getElementById('podcast-player');
    if (playerDiv.style.display === 'none') {
      playerDiv.style.display = 'block';
    } else {
      playerDiv.style.display = 'none';
    }
  }

  window.addEventListener('pageshow', function () {
    if (!document.getElementById('player')?.hasChildNodes()) {
      onYouTubeIframeAPIReady();
    }
  });
</script>


<script>
  function toggleCompleted(videoId) {
    const checkbox = document.getElementById('completed-checkbox');
    const isChecked = checkbox.checked;

    fetch(`/toggle-completion/${videoId}/`, {
      method: 'POST',
      headers: {
        'X-CSRFToken': getCSRFToken(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ completed: isChecked })
    })
    .then(response => {
      if (!response.ok) throw new Error("Request failed");
      return response.json();
    })
    .then(data => {
      console.log('Updated:', data);
    })
    .catch(error => {
      console.error('Error:', error);
      // במקרה של שגיאה – להחזיר את המצב לקודם
      checkbox.checked = !isChecked;
    });
  }

  function getCSRFToken() {
    return document.cookie.split('; ')
      .find(row => row.startsWith('csrftoken='))
      ?.split('=')[1];
  }
</script>
