<section id="presentation-wrapper"
         style="text-align: center; padding: 30px; background-color: #1e1e1e; color: #ffffff; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.4); max-width: 1000px; margin: auto; font-family: Arial, sans-serif;">

  <h2 style="margin-bottom: 20px;">📑 מצגת: Jenkins - היכרות כללית</h2>

  <label class="completed-checkbox-label">
        <input type="checkbox" id="completedP-checkbox"
               {% if PresentationCompleted %}checked{% endif %}
               onchange="togglePresentationCompleted({{ presentation.id }})">
        השלמתי את המצגת
    </label>
  <!-- מצגת מוטמעת -->
  <div style="position: relative;">
    <iframe
      id="slideFrame"
      src="{{ presentation.embed_url }}&rm=minimal"
      width="100%"
      height="500px"
      frameborder="0"
      allowfullscreen
      title="מצגת ג'נקינס"
    ></iframe>

    <!-- כפתורי שליטה -->
    <div style="margin-top: 20px;">
      <button onclick="prevSlide()" class="btn-nav">◀️ קודם</button>
      <button onclick="nextSlide()" class="btn-nav">▶️ הבא</button>
      <button onclick="toggleFullscreen()" class="btn-nav">⛶ מסך מלא</button>
    </div>
  </div>

  <!-- מעבר לשאלות -->
  <div id="questions-btn" style="margin-top: 30px; display: none;">
    <a href="/learning/" class="btn-next">כל הכבוד סיימת את הלומדה! לחץ למעבר ללומדות נוספות</a>
  </div>
</section>

<!-- עיצוב כפתורים -->
<style>
  .btn-nav {
    background-color: #007acc;
    color: white;
    padding: 10px 20px;
    margin: 0 8px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
  }

  .btn-nav:hover {
    background-color: #005fa3;
  }

  .btn-next {
    background-color: #00cc88;
    color: white;
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
  }

  .btn-next:hover {
    background-color: #009e6e;
  }


   .completed-checkbox-label {
    display: flex;
    align-items: center;
    font-size: 1.2em;
    color: #2d3748;
    cursor: pointer;
    user-select: none;
    gap: 10px;
    padding: 10px 15px;
    border-radius: 8px;
    border: 2px solid #718096;
    transition: all 0.3s ease;
    background-color: #edf2f7;
  }

  .completed-checkbox-label:hover {
    background-color: #e2e8f0;
  }

  .completed-checkbox-label input[type="checkbox"] {
    appearance: none;
    width: 24px;
    height: 24px;
    border: 2px solid #718096;
    border-radius: 4px;
    background-color: white;
    position: relative;
    transition: background-color 0.3s;
  }

  .completed-checkbox-label input[type="checkbox"]:checked {
    background-color: #48bb78;
    border-color: #48bb78;
  }

  .completed-checkbox-label input[type="checkbox"]::after {
    content: '✔';
    color: white;
    position: absolute;
    top: 0;
    left: 5px;
    font-size: 18px;
    display: none;
  }

  .completed-checkbox-label input[type="checkbox"]:checked::after {
    display: block;
  }

</style>

<!-- שליטה על שקופיות -->
<script>
  let currentSlide = 0;
  const totalSlides = 8; // שנה לפי מספר השקופיות שלך

  function updateIframe() {
    const iframe = document.getElementById('slideFrame');
    const baseUrl = "{{ presentation.embed_url|cut:'?start=false&loop=false&delayms=3000' }}";
    iframe.src = baseUrl + `?start=false&loop=false&delayms=3000&slide=${currentSlide}`;
  }

  function nextSlide() {
    if (currentSlide < totalSlides - 1) {
      currentSlide++;
      updateIframe();
    }

    if (currentSlide === totalSlides - 1) {
      document.getElementById('questions-btn').style.display = 'block';
    }
  }

  function prevSlide() {
    if (currentSlide > 0) {
      currentSlide--;
      updateIframe();
    }
  }

  function toggleFullscreen() {
    const iframe = document.getElementById('slideFrame');
    if (iframe.requestFullscreen) iframe.requestFullscreen();
    else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
    else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
    else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
  }

  // תמיכה דרך מקשי חיצים
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });
</script>



<script>
    function togglePresentationCompleted(presentationId) {
      const checkbox = document.getElementById('completedP-checkbox');
      const isChecked = checkbox.checked;

      fetch(`/toggle-presentation-completion/${presentationId}/`, {
        method: 'POST',
        headers: {
          'X-CSRFToken': getCSRFToken(),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ presentation_completed: isChecked })
      })
      .then(response => {
        if (!response.ok) throw new Error("Request failed");
        return response.json();
      })
      .then(data => {
        console.log('Updated:', data);
      })
      .catch(error => {
        console.error('Error:', error);
        // במקרה של שגיאה – להחזיר את המצב לקודם
        checkbox.checked = !isChecked;
      });
    }

    function getCSRFToken() {
      return document.cookie.split('; ')
        .find(row => row.startsWith('csrftoken='))
        ?.split('=')[1];
    }
</script>
