<section id="section1" aria-labelledby="section1-title"
         style="padding: 30px; max-width: 900px; margin: auto; background-color: #1e1e1e; color: #ffffff; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.4); font-family: Arial, sans-serif;">

  <h2 id="section1-title" tabindex="0">{{ video.title }}</h2>
  <p tabindex="0" style="font-size: 1.1em;">{{ video.description }}</p>

  {% if podcasts %}
  <div id="podcast-block" style="margin: 30px 0;" role="region" aria-label="נגן פודקאסט בנושא זה">
    <button onclick="togglePodcast()" style="background-color: #00cc88; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
      🎧 לחץ להשמעת פודקאסט בנושא זה
    </button>
    <div id="podcast-player" style="display:none; margin-top: 20px;">
      <audio controls style="width: 100%;">
        <source src="{{ podcasts.0.audio_file.url }}" type="audio/wav">
        הדפדפן שלך לא תומך בניגון אודיו.
      </audio>
      <div style="margin-top: 10px;">
        <a href="{{ podcasts.0.audio_file.url }}" download style="text-decoration: none; background-color: #4CAF50; color: white; padding: 8px 16px; border-radius: 5px;">
          ⬇️ הורד פודקאסט למחשב
        </a>
      </div>
    </div>
  </div>
  {% endif %}

  <div id="player" role="region" aria-label="נגן וידאו - {{ video.title }}" tabindex="0" style="margin-bottom: 20px;"></div>

  <!-- שאלות -->
  <div id="question1" class="question" style="display:none; margin-top: 20px; background-color: #2c2c2c; border-radius: 10px; padding: 20px;" role="group" aria-labelledby="q1-label">
    <p id="q1-label" tabindex="0"><strong>מה זה Jenkins?</strong></p>
    <div role="radiogroup" aria-labelledby="q1-label">
      <label><input type="radio" name="q1" value="a"> כלי לניהול קוד מקור כמו Git</label><br>
      <label><input type="radio" name="q1" value="b"> מערכת לאוטומציה של תהליכי פיתוח ותצורה (CI/CD)</label><br>
      <label><input type="radio" name="q1" value="c"> מערכת ענן לאחסון פרויקטים</label><br>
    </div><br>
    <button onclick="checkAnswer('q1', 'b', 'feedback1')" aria-label="בדוק תשובה לשאלה הראשונה" class="btn-answer">בדוק תשובה</button>
    <div id="feedback1" class="feedback" style="display:none;" aria-live="assertive"></div>
    <button id="resume1" onclick="resumeVideo('question1', 'feedback1', 'resume1')" style="display:none;" class="btn-resume">המשך צפייה</button>
  </div>

  <div id="question2" class="question" style="display:none; margin-top: 20px; background-color: #2c2c2c; border-radius: 10px; padding: 20px;" role="group" aria-labelledby="q2-label">
    <p id="q2-label" tabindex="0"><strong>למה חשוב להשתמש ב-Jenkins בפרויקט תוכנה?</strong></p>
    <div role="radiogroup" aria-labelledby="q2-label">
      <label><input type="radio" name="q2" value="a"> כדי לאחסן את הקוד בגיבוי</label><br>
      <label><input type="radio" name="q2" value="b"> כדי להריץ בדיקות, לבנות קוד ולבצע דיפלוי בצורה אוטומטית</label><br>
      <label><input type="radio" name="q2" value="c"> כדי לעקוב אחרי באגים</label><br>
    </div><br>
    <button onclick="checkAnswer('q2', 'b', 'feedback2')" aria-label="בדוק תשובה לשאלה השנייה" class="btn-answer">בדוק תשובה</button>
    <div id="feedback2" class="feedback" style="display:none;" aria-live="assertive"></div>
    <button id="resume2" onclick="resumeVideo('question2', 'feedback2', 'resume2')" style="display:none;" class="btn-resume">המשך צפייה</button>
  </div>

  <div style="margin-top: 30px; text-align: left;">
    <a href="?step=1q{% if request.GET.accessible %}&accessible=1{% endif %}"
       class="btn-next"
       role="button"
       aria-label="עבור לשאלות נוספות בנושא זה">
      👉 עבור לשאלות נוספות בנושא
    </a>
  </div>
</section>

<style>
  .btn-answer, .btn-resume, .btn-next {
    background-color: #00cc88;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
  }

  .btn-next {
    background-color: #007acc;
    text-decoration: none;
    display: inline-block;
  }

  .btn-answer:hover, .btn-resume:hover, .btn-next:hover {
    background-color: #009e6e;
  }

  .feedback {
    font-weight: bold;
    margin-top: 10px;
  }
</style>
<!-- YouTube Script -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const videoIdFromDB = "{{ video.youtube_id }}";
  let player;
  let interval = null;
  let question1Shown = false;
  let question2Shown = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '360',
      width: '640',
      videoId: videoIdFromDB,
      events: { 'onStateChange': onPlayerStateChange }
    });
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING && !interval) {
      interval = setInterval(() => {
        const time = Math.floor(player.getCurrentTime());

        if (time >= 120 && !question1Shown) {
          exitFullscreen();
          player.pauseVideo();
          showQuestion('question1');
          question1Shown = true;
        }

        if (time >= 240 && !question2Shown) {
          exitFullscreen();
          player.pauseVideo();
          showQuestion('question2');
          question2Shown = true;
        }

        if (question1Shown && question2Shown) {
          clearInterval(interval);
          interval = null;
        }
      }, 1000);
    }

    if (e.data === YT.PlayerState.PAUSED && interval) {
      clearInterval(interval);
      interval = null;
    }
  }

  function showQuestion(id) {
    const q = document.getElementById(id);
    q.style.display = 'block';
    q.setAttribute('tabindex', '-1');
    q.focus(); // פוקוס אוטומטי לשאלה
  }

  function exitFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  function checkAnswer(qName, correctVal, feedbackId) {
    const selected = Array.from(document.getElementsByName(qName)).find(r => r.checked);
    const feedback = document.getElementById(feedbackId);
    if (!selected) {
      feedback.innerText = "אנא בחר תשובה";
    } else if (selected.value === correctVal) {
      feedback.innerHTML = "<span style='color:lightgreen'>✅ תשובה נכונה!</span>";
    } else {
      feedback.innerHTML = "<span style='color:#ff5555'>❌ תשובה שגויה.</span> " + getExplanation(qName);
    }
    feedback.style.display = 'block';
    document.getElementById('resume' + qName[qName.length - 1]).style.display = 'inline-block';
  }

  function resumeVideo(qDivId, fbId, btnId) {
    document.getElementById(qDivId).style.display = 'none';
    document.getElementById(fbId).style.display = 'none';
    document.getElementById(btnId).style.display = 'none';
    player.playVideo();
  }

  function getExplanation(qName) {
    switch (qName) {
      case 'q1': return "Jenkins הוא כלי לאוטומציה של תהליכי פיתוח כמו בנייה, בדיקות ודיפלוי.";
      case 'q2': return "שימוש ב־Jenkins מאפשר חיסכון בזמן ודיוק בתהליך ה־CI/CD.";
      default: return "";
    }
  }

  function togglePodcast() {
    const playerDiv = document.getElementById('podcast-player');
    playerDiv.style.display = (playerDiv.style.display === 'none') ? 'block' : 'none';
  }

  window.addEventListener('pageshow', function () {
    if (!document.getElementById('player')?.hasChildNodes()) {
      onYouTubeIframeAPIReady();
    }
  });
</script>
