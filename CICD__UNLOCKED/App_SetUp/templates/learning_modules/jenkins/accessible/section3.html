<section id="section3" aria-labelledby="section3-title"
         style="padding: 30px; max-width: 900px; margin: auto; background-color: #1e1e1e; color: #ffffff; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.4); font-family: Arial, sans-serif;">

  <h2 id="section3-title" tabindex="0">{{ video.title }}</h2>
  <p tabindex="0" style="font-size: 1.1em;">{{ video.description }}</p>

  {% if podcasts %}
  <div id="podcast-block" role="region" aria-label="נגן פודקאסט - {{ video.title }}" style="margin: 30px 0;">
    <button onclick="togglePodcast()" aria-expanded="false" aria-controls="podcast-player"
            style="background-color: #00cc88; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
      🎧 לחץ להשמעת פודקאסט בנושא זה
    </button>
    <div id="podcast-player" style="display:none; margin-top: 20px;">
      <audio controls style="width: 100%;" aria-label="נגן שמע לפודקאסט">
        <source src="{{ podcasts.0.audio_file.url }}" type="audio/wav">
        הדפדפן שלך לא תומך בניגון אודיו.
      </audio>
      <div style="margin-top: 10px;">
        <a href="{{ podcasts.0.audio_file.url }}" download
           style="text-decoration: none; background-color: #4CAF50; color: white; padding: 8px 16px; border-radius: 5px;"
           role="button" aria-label="הורד את הפודקאסט למחשב">
          ⬇️ הורד פודקאסט למחשב
        </a>
      </div>
    </div>
  </div>
  {% endif %}

  <!-- נגן YouTube -->
  <div id="player" role="region" aria-label="נגן וידאו - {{ video.title }}" tabindex="0" style="margin-bottom: 20px;"></div>

  <!-- כפתור מעבר -->
  <div style="margin-top: 30px; text-align: left;">
    <a href="?step=3q{% if request.GET.accessible %}&accessible=1{% endif %}"
       class="btn-next"
       role="button"
       aria-label="עבור לשאלות נוספות בנושא">
      👉 עבור לשאלות נוספות בנושא
    </a>
  </div>
</section>

<!-- עיצוב כפתורים -->
<style>
  .btn-next {
    background-color: #007acc;
    color: white;
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    text-decoration: none;
    display: inline-block;
    transition: background-color 0.3s;
  }

  .btn-next:hover {
    background-color: #005fa3;
  }

  button:hover,
  button:focus {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
</style>

<!-- סקריפט YouTube -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const videoIdFromDB = "{{ video.youtube_id }}";
  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '360',
      width: '640',
      videoId: videoIdFromDB
    });
  }

  function togglePodcast() {
    const playerDiv = document.getElementById('podcast-player');
    playerDiv.style.display = (playerDiv.style.display === 'none') ? 'block' : 'none';
  }

  window.addEventListener('pageshow', function () {
    if (!document.getElementById('player')?.hasChildNodes()) {
      onYouTubeIframeAPIReady();
    }
  });
</script>
