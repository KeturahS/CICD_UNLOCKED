<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>אימות עומס | האם אתה רובוט?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Bootstrap (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: "Segoe UI", sans-serif;
        }

        .captcha-container {
            max-width: 450px;
            margin: 100px auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h3 {
            text-align: center;
            margin-bottom: 30px;
            color: #0d6efd;
        }

        .g-recaptcha {
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
        }

        .error-msg {
            text-align: center;
            color: #dc3545;
            font-weight: bold;
        }

        .btn-submit {
            width: 100%;
            background-color: #0d6efd;
            border: none;
            font-weight: bold;
        }

        .btn-submit:hover {
            background-color: #084298;
        }
    </style>
</head>
<body>

<div class="captcha-container">
    <h3>אימות: האם אתה רובוט?</h3>

    <form method="post">
        {% csrf_token %}
        <div class="g-recaptcha" data-sitekey="6LciUk4rAAAAAGMicjZ-yjjM2nSiO4auqWFhA9Gt"></div>
        <button type="submit" class="btn btn-primary btn-submit mt-3">המשך</button>
    </form>

    {% if error %}
        <p class="error-msg mt-3">{{ error }}</p>
    {% endif %}
</div>

</body>
</html>
