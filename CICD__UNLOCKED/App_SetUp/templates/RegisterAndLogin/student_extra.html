<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>פרטי סטודנט נוספים</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Assistant', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2e2e3e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f1f1;
    }

    .card {
      background: #2b2b3c;
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      padding: 2rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
    }

    h3 {
      color: #81aaff;
      font-weight: 700;
    }

    label {
      font-weight: 500;
    }

    .form-label {
      color: #f1f1f1;
    }

    .form-select,
    .form-control {
      border-radius: 10px;
      padding: 10px;
      background-color: #3c3c4e;
      color: #fff;
      border: 1px solid #555;
    }

    .form-select option {
      background-color: #3c3c4e;
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(to right, #0d6efd, #3a8ee6);
      border: none;
      border-radius: 30px;
      padding: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(to right, #095ad5, #2f77c8);
      transform: scale(1.03);
    }

    a {
      color: #81aaff;
      font-weight: 500;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .alert {
      border-radius: 12px;
      font-size: 14px;
    }

    .alert-danger {
      background-color: #5a1e1e;
      border: 1px solid #ff6666;
      color: #ffb3b3;
    }

    .form-check-input {
      border-radius: 4px;
      background-color: #3c3c4e;
      border: 1px solid #777;
    }

    .form-check-label {
      font-size: 15px;
      color: #fff;
    }

    .text-end {
      font-size: 14px;
    }

  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="card mx-auto" style="max-width: 600px;">
      <h3 class="text-center mb-4">השלמת הרשמה לסטודנט</h3>

      {% if msg %}
        <div class="alert alert-danger text-center">{{ msg }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">מוסד לימודים</label>
          <select name="institution" class="form-select" required>
            <option value="">בחר מוסד לימודים</option>
            <option value="SCE">SCE - המכללה האקדמית להנדסה ע"ש סמי שמעון</option>
            <option value="TAU">אוניברסיטת תל אביב</option>
            <option value="HUJI">האוניברסיטה העברית בירושלים</option>
            <option value="TECH">הטכניון</option>
            <option value="BIU">אוניברסיטת בר אילן</option>
            <option value="BGU">אוניברסיטת בן גוריון</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">תאריך סיום משוער</label>
          <input type="date" name="target_completion_date" class="form-control" required>
        </div>

        <div class="mb-3 text-end">
          <a href="{% url 'terms' %}" target="_blank">קרא את תנאי השימוש</a>
        </div>

        <div class="form-check mb-4">
          <input type="checkbox" class="form-check-input" id="agree" required>
          <label class="form-check-label" for="agree">אני מאשר/ת את תנאי השימוש</label>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>הרשמה</button>
      </form>
    </div>
  </div>

  <script>
    const checkbox = document.getElementById('agree');
    const button = document.getElementById('submitBtn');
    checkbox.addEventListener('change', () => {
      button.disabled = !checkbox.checked;
    });
  </script>
</body>
</html>
