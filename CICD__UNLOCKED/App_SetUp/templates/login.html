<!DOCTYPE html>
{% load static %}
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>כניסת משתמשים | CiCd Unlocked</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom right, #e6f0ff, #d0e2ff);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-weight: 700;
            color: #004a99;
        }

        .form-label {
            font-weight: 600;
            color: #1f2d3d;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-primary {
            background-color: #004a99;
            border: none;
            border-radius: 30px;
            padding: 10px 30px;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #003b7a;
        }

        a {
            color: #004a99;
            font-weight: 500;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-msg {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-6">
        <div class="card p-5">
            <h2 class="text-center mb-3">כניסת משתמשים</h2>
            <div class="login-msg text-center">
                {% if msg %}
                    {{ msg|safe }}
                {% else %}
                    הזן את שם המשתמש והסיסמה שלך כדי להתחבר
                {% endif %}
            </div>
            <form method="post" autocomplete="off" novalidate>
                {% csrf_token %}

                <!-- שדות פיקטיביים נגד מילוי אוטומטי -->
                <input type="text" name="fake_username" autocomplete="username" style="display: none;">
                <input type="password" name="fake_password" autocomplete="new-password" style="display: none;">

                <div class="mb-3">
                    <label for="username" class="form-label">שם משתמש</label>
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">סיסמה</label>
                    {{ form.password }}
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="{% url 'password_reset' %}">שכחת סיסמה?</a>
                </div>

                <div class="d-grid">
                    <input type="submit" value="התחבר" class="btn btn-primary">
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
