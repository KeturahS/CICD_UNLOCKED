<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>עדכון פרופיל סטודנט</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            direction: rtl;
            padding: 40px;
        }

        .form-container {
            background: white;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 25px;
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1abc9c;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>עדכון פרופיל סטודנט</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">שמור שינויים</button>
        </form>
    </div>
</body>
</html>
