<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>תנאי שימוש</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h3 class="mb-4">תנאי שימוש באתר</h3>
      <p>ברוך הבא למערכת שלנו. עליך לקרוא ולהסכים לתנאי השימוש כדי להמשיך בשימוש באתר.</p>
      <p>1. השימוש באתר נעשה באחריות המשתמש בלבד.</p>
      <p>2. אין להעביר את פרטי הכניסה לאחרים.</p>
      <p>3. השימוש במערכת מיועד לצורכי לימוד בלבד.</p>
      <p>4. הפרת תנאים אלו עשויה להוביל לחסימת גישה.</p>
    </div>
  </div>
</body>
</html>
