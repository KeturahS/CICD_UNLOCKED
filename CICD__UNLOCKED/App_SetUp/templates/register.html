<!doctype html>
{% load static %}
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>רישום משתמשים</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
      /* RTL form adjustments */
      .form-check {
        display: flex;
        align-items: center;
      }

      .form-check-input {
        margin-right: 0;
        margin-left: 0.5rem;
        order: 2;
      }

      .form-check-label {
        order: 1;
      }

      /* Improve form inputs */
      .form-control:focus,
      .form-check-input:focus {
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
      }

      /* Add responsive typography */
      @media (max-width: 576px) {
        .card {
          padding: 1rem !important;
        }

        h2 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center mt-5">
        <div class="col-md-6">
          <div class="card shadow-sm p-4">
            <h2 class="text-center mb-4">דף רישום משתמש</h2>

            {% if msg %}
              <div class="alert alert-info">{{ msg | safe }}</div>
            {% else %}
              <p class="text-center text-muted">דף הרשמה</p>
            {% endif %}

            <form method="post" novalidate autocomplete="off">
              {% csrf_token %}

              <div class="mb-3">
                <label for="username" class="form-label">שם משתמש</label>
                {{ form.username }}
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">אימייל</label>
                {{ form.email }}
              </div>

              <div class="mb-3">
                <label for="password1" class="form-label">סיסמה</label>
                {{ form.password1 }}
              </div>

              <div class="mb-3">
                <label for="password2" class="form-label">אישור סיסמה</label>
                {{ form.password2 }}
              </div>

              <fieldset class="mb-3">
                <legend class="form-label fs-6">בחר תפקיד</legend>
                <div class="form-check">
                  <input type="radio" name="role" id="student" value="student" class="form-check-input" checked>
                  <label for="student" class="form-check-label">סטודנט</label>
                </div>
                <div class="form-check">
                  <input type="radio" name="role" id="lecturer" value="lecturer" class="form-check-input">
                  <label for="lecturer" class="form-check-label">מרצה</label>
                </div>
                <div class="form-check">
                  <input type="radio" name="role" id="admin" value="admin" class="form-check-input">
                  <label for="admin" class="form-check-label">מנהל</label>
                </div>
              </fieldset>



              {% if form.errors %}
              <div class="alert alert-danger">
                {{ form.errors }}
              </div>
              {% endif %}

              <button type="submit" class="btn btn-primary w-100">הרשמה</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
