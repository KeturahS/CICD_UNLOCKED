<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>תפריט ראשי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(to bottom right, #e6f0fa, #f7faff);
            color: #2c3e50;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(to left, #0d6efd, #2568ef);
            padding: 18px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease-in-out;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            background-color: #ffffff;
            left: 0;
            bottom: -5px;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #d9f1ff;
        }

        .content {
            padding: 60px 20px;
            text-align: center;
        }

        .content h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #0d3b66;
        }

        .content p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{% url 'student_profile' %}">פרופיל סטודנט</a>
        <a href="{% url 'contact_us' %}">צור קשר עם צוות האתר</a>
        <a href="{% url 'student_messages' %}">צפייה בהודעות שלי</a>
    </div>

    <div class="content">
        <h2>ברוך הבא למערכת CiCd Unlocked</h2>
        <p>אנא בחר פעולה מתוך התפריט העליון.</p>
    </div>

</body>
</html>
