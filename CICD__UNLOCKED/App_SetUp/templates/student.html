<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>תפריט ראשי</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .navbar a:hover {
            color: #1abc9c;
        }

        .content {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{% url 'student_profile' %}">פרופיל סטודנט</a>

    </div>

    <div class="content">

        <p>בחר קישור מהתפריט למעלה.</p>
    </div>

</body>
</html>
