<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>עדכון פרופיל סטודנט | CiCd Unlocked</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom right, #e3f2fd, #ffffff);
            margin: 0;
            padding: 40px;
            direction: rtl;
        }

        .form-container {
            background-color: #ffffff;
            padding: 40px;
            max-width: 700px;
            margin: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
        }

        h2 {
            margin-bottom: 25px;
            color: #0d47a1;
            text-align: center;
            font-weight: 700;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: border-color 0.3s ease;
            font-size: 15px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1976d2;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1976d2;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            margin-top: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0d47a1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .info-text {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>עדכון פרטי סטודנט</h2>
        <div class="info-text">נא לעדכן את המידע שלך ולשמור את השינויים</div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">שמור שינויים</button>
        </form>
    </div>
</body>
</html>
