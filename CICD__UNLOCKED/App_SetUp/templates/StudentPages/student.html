<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>תפריט ראשי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(to bottom right, #e6f0fa, #f7faff);
            color: #2c3e50;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(to left, #0d6efd, #2568ef);
            padding: 18px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .navbar a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease-in-out;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            width: 0%;
            height: 2px;
            background-color: #ffffff;
            left: 0;
            bottom: -5px;
            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #d9f1ff;
        }

        .content {
            padding: 60px 20px;
            text-align: center;
        }

        .content h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #0d3b66;
        }

        .content p {
            font-size: 18px;
            color: #555;
        }



        .learning-module {
    max-width: 600px;
    margin: 60px auto;
    background: linear-gradient(to right, #ffffff, #f1f8ff);
    border: 2px solid #d6eaff;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 123, 255, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}
.learning-module:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 28px rgba(0, 123, 255, 0.25);
}
.learning-module .icon {
    font-size: 48px;
    margin-bottom: 15px;
}
.learning-module h3 {
    font-size: 26px;
    margin-bottom: 10px;
    color: #0d3b66;
}
.learning-module p {
    font-size: 18px;
    color: #444;
    margin-bottom: 20px;
}
.start-btn {
    font-size: 16px;
    padding: 10px 25px;
    background-color: #0d6efd;
    color: white;
    border: none;
    border-radius: 25px;
    transition: background-color 0.3s ease;
}
.start-btn:hover {
    background-color: #084cdf;
}
    </style>
</head>
<body>

    <div class="navbar">
    <a href="{% url 'student_profile' %}">פרופיל סטודנט</a>
    <a href="{% url 'contact_us' %}">צור קשר עם צוות האתר</a>
    <a href="{% url 'view_my_messages' %}">צפייה בהודעות שלי</a>
    <a href="{% url 'student_messages' %}">צפייה בפניות שלי</a>
    <a href="{% url 'rate_modules' %}">דרג את הלומדות</a>
    <a href="{% url 'student_progress' %}">התקדמות בלמידה</a>
    <a href="{% url 'qa:QA_Page' %}">שאלות ותשובות</a>
</div>


    <div class="content">
        <h2>ברוך הבא למערכת CiCd Unlocked</h2>
        <p>אנא בחר פעולה מתוך התפריט העליון.</p>
    </div>


<div class="learning-module" onclick="window.location.href='{% url 'learning_home' %}'">
    <div class="icon">📘</div>
    <h3>ברוך הבא ללומדה</h3>
    <p>למד על Git, Jenkins ו-Docker דרך לומדה אינטראקטיבית, מעשית וידידותית למשתמש.</p>
    <button class="start-btn">🚀 התחל את הלמידה</button>
</div>



</body>
</html>
