{% extends 'base.html' %}

{% block title %}תפריט ראשי{% endblock %}

{% block content %}
<div class="container" style="direction: rtl; font-family: 'Assistant', sans-serif;">

  <div class="content text-center" style="padding: 60px 20px;">
    <h2 style="font-size: 36px; margin-bottom: 20px; color: #0d3b66;">
      ברוך הבא למערכת CiCd Unlocked
    </h2>
    <p style="font-size: 18px; color: #555;">
      אנא בחר פעולה מתוך התפריט העליון.
    </p>
  </div>

  <div class="learning-module" onclick="window.location.href='{% url 'learning_home' %}'" style="
      max-width: 600px;
      margin: 60px auto;
      background: linear-gradient(to right, #ffffff, #f1f8ff);
      border: 2px solid #d6eaff;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 123, 255, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    "
    onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 12px 28px rgba(0, 123, 255, 0.25)'"
    onmouseout="this.style.transform='none'; this.style.boxShadow='0 8px 24px rgba(0, 123, 255, 0.15)'"
  >
    <div class="icon" style="font-size: 48px; margin-bottom: 15px;">📘</div>
    <h3 style="font-size: 26px; margin-bottom: 10px; color: #0d3b66;">ברוך הבא ללומדה</h3>
    <p style="font-size: 18px; color: #444; margin-bottom: 20px;">
      למד על Git, Jenkins ו-Docker דרך לומדה אינטראקטיבית, מעשית וידידותית למשתמש.
    </p>
    <button class="start-btn" style="
        font-size: 16px;
        padding: 10px 25px;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 25px;
        transition: background-color 0.3s ease;
      "
      onmouseover="this.style.backgroundColor='#084cdf'"
      onmouseout="this.style.backgroundColor='#0d6efd'"
    >
      🚀 התחל את הלמידה
    </button>
  </div>

</div>

<style>
  .learning-module:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 28px rgba(0, 123, 255, 0.25);
  }
  .start-btn:hover {
    background-color: #084cdf;
  }
</style>
{% endblock %}
