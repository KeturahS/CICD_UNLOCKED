<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הפניות שלי</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #e0e0e0;
        }

        .resolved {
            color: green;
            font-weight: bold;
        }

        .unresolved {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>הפניות שלי</h2>

    {% if messages %}
        <table>
            <thead>
                <tr>
                    <th>נושא</th>
                    <th>קטגוריה</th>
                    <th>תאריך שליחה</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody>
                {% for msg in messages %}
                    <tr>
                        <td>{{ msg.subject }}</td>
                        <td>{{ msg.get_category_display }}</td>
                        <td>{{ msg.created_at|date:"d/m/Y H:i" }}</td>
                        <td class="{% if msg.is_resolved %}resolved{% else %}unresolved{% endif %}">
                            {% if msg.is_resolved %}טופלה{% else %}ממתינה לטיפול{% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>לא נמצאו פניות.</p>
    {% endif %}
</div>

</body>
</html>
