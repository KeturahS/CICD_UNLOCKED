<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git vs GitHub - פעילות אינטראקטיבית</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
  <style>
  :root {
    --primary-color: #7aa2f7;
    --secondary-color: #bb9af7;
    --git-color: #f7768e;
    --github-color: #414868;
    --success-color: #9ece6a;
    --error-color: #f7768e;
    --dark-bg: #1a1b26;
    --darker-bg: #12121a;
    --light-text: #c0caf5;
    --border-color: #2f2f43;
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.6);
    --transition: all 0.3s ease;
  }

  body {
    font-family: 'Rubik', Arial, sans-serif;
    background: var(--dark-bg);
    color: var(--light-text);
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.6;
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }

  h2 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary-color);
    margin-bottom: 15px;
    position: relative;
    display: inline-block;
  }

  h2::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, var(--git-color), var(--github-color));
    border-radius: 2px;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #a9b1d6;
    max-width: 600px;
    margin: 0 auto;
  }

  .container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    max-width: 1200px;
    margin: 40px auto;
  }

  .zone {
    border: 2px dashed var(--border-color);
    border-radius: 16px;
    background-color: var(--darker-bg);
    width: 300px;
    min-height: 400px;
    padding: 20px;
    box-shadow: var(--shadow-md);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .zone:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-5px);
  }

  .zone::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: #2d2f4a;
    border-radius: 6px 6px 0 0;
  }

  #git::before {
    background: var(--git-color);
  }

  #github::before {
    background: var(--github-color);
  }

  .zone h3 {
    margin: 0 0 20px 0;
    padding-bottom: 15px;
    font-size: 1.4rem;
    border-bottom: 1px solid var(--border-color);
    text-align: center;
  }

  #warehouse h3 {
    color: #a9b1d6;
  }

  #git h3 {
    color: var(--git-color);
  }

  #github h3 {
    color: var(--primary-color);
  }

  .zone-content {
    min-height: 300px;
  }

  .item {
    background-color: #2a2f4a;
    border-left: 4px solid #3b4261;
    padding: 12px 15px;
    margin: 10px 0;
    border-radius: 8px;
    cursor: grab;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    font-size: 0.95rem;
    color: var(--light-text);
  }

  #warehouse .item {
    border-left-color: #7c7f9c;
  }

  #git .item {
    border-left-color: var(--git-color);
  }

  #github .item {
    border-left-color: var(--primary-color);
  }

  .item:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .item.dragging {
    opacity: 0.6;
    transform: scale(0.95);
    box-shadow: var(--shadow-lg);
  }

  .button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 40px;
  }

  button {
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 500;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
    min-width: 200px;
  }

  button:hover {
    background-color: #6183bb;
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(1px);
  }

  #check-btn {
    background-color: var(--success-color);
  }

  #check-btn:hover {
    background-color: #7ecf62;
  }

  #next-section-btn {
    background-color: var(--secondary-color);
    display: none;
  }

  #next-section-btn:hover {
    background-color: #9d7fe7;
  }

  #result {
    margin: 25px 0;
    font-weight: 500;
    font-size: 1.2rem;
    padding: 15px 25px;
    border-radius: 8px;
    display: inline-block;
    transition: var(--transition);
    opacity: 0;
    transform: translateY(10px);
  }

  #result.show {
    opacity: 1;
    transform: translateY(0);
  }

  #result.success {
    background-color: rgba(158, 206, 106, 0.1);
    color: var(--success-color);
    border: 1px solid rgba(158, 206, 106, 0.2);
  }

  #result.error {
    background-color: rgba(247, 118, 142, 0.1);
    color: var(--error-color);
    border: 1px solid rgba(247, 118, 142, 0.2);
  }

  @media (max-width: 768px) {
    .container {
      flex-direction: column;
      align-items: center;
    }

    .zone {
      width: 100%;
      max-width: 400px;
    }

    h2 {
      font-size: 1.6rem;
    }
  }

  .zone.highlight {
    border-color: #7aa2f7;
    background-color: rgba(122, 162, 247, 0.08);
  }

  .zone:empty::after {
    content: 'גרור פריטים לכאן';
    display: block;
    text-align: center;
    color: #5c5e7e;
    margin-top: 40px;
    font-style: italic;
  }
  .incorrect {
    outline: 3px solid red !important;
    box-shadow: 0 0 10px red !important;
  }
</style>

</head>
<body>

<div class="page-header">
  <h2>גרור כל מושג למקום הנכון: Git או GitHub</h2>
  <p class="subtitle">מיין את המושגים השונים לפי השייכות שלהם - האם הם קשורים ל-Git או ל-GitHub?</p>
</div>

<div class="container">
  <div class="zone" id="warehouse" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h3>🗃️ מחסן המושגים</h3>
    <div class="zone-content">
      {% for phrase in all_sentences %}
        <div class="item" draggable="true" ondragstart="drag(event)" id="item-{{ phrase.type|lower }}-{{ forloop.counter }}">
          {{ phrase.sentence }}
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="zone" id="git" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h3>🌀 Git</h3>
    <div class="zone-content"></div>
  </div>

  <div class="zone" id="github" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h3>🌐 GitHub</h3>
    <div class="zone-content"></div>
  </div>
</div>

<div class="button-container">
  <button id="check-btn" onclick="checkAnswers()">בדוק תשובות</button>
  <div id="result"></div>
  <button id="next-section-btn" onclick="goToNext()">⬅ עבור ללמידה הבאה</button>
</div>

<script>
  const correctAnswers = { git: [], github: [] };

  function removeIncorrect(element) {
      element.classList.remove("incorrect");
  }

  const allSentences = [
    {% for phrase in all_sentences %}
      { id: "item-{{ phrase.type|lower }}-{{ forloop.counter }}", type: "{{ phrase.type|lower }}" },
    {% endfor %}
  ];

  allSentences.forEach(sentence => {
    if (sentence.type === "git") {
      correctAnswers.git.push(sentence.id);
    } else if (sentence.type === "github") {
      correctAnswers.github.push(sentence.id);
    }
  });

  function allowDrop(ev) {
    ev.preventDefault();
    // Add highlight class to drop zone
    if (ev.target.classList.contains('zone') || ev.target.classList.contains('zone-content')) {
      const zone = ev.target.classList.contains('zone') ? ev.target : ev.target.closest('.zone');
      zone.classList.add('highlight');
    }
  }

  // Remove highlight when dragging leaves the zone
  document.querySelectorAll('.zone').forEach(zone => {
    zone.addEventListener('dragleave', function(e) {
      if (e.target.classList.contains('zone') || e.target.classList.contains('zone-content')) {
        const zone = e.target.classList.contains('zone') ? e.target : e.target.closest('.zone');
        zone.classList.remove('highlight');
      }
    });
  });

  function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
    ev.target.classList.add("dragging");
  }

  function drop(ev) {
    ev.preventDefault();
    const id = ev.dataTransfer.getData("text");
    const el = document.getElementById(id);

    // Find the correct container to append to
    let dropTarget = ev.target;

    // If we're dropping on an item, find the parent zone
    if (dropTarget.classList.contains('item')) {
      dropTarget = dropTarget.closest('.zone');
    }
    // If we're dropping on zone-content, use that
    else if (dropTarget.classList.contains('zone-content')) {
      // Use zone-content directly
    }
    // If we're dropping on the zone itself, find its zone-content
    else if (dropTarget.classList.contains('zone')) {
      dropTarget = dropTarget.querySelector('.zone-content');
    }

    // Only proceed if we found a valid drop target
    if (dropTarget) {
      dropTarget.appendChild(el);
      el.classList.remove("dragging");
    }

    // Remove highlight from all zones
    document.querySelectorAll('.zone').forEach(zone => {
      zone.classList.remove('highlight');
    });
  }

  function checkAnswers() {
    const gitBox = document.getElementById("git");
    const githubBox = document.getElementById("github");
    const gitItems = Array.from(gitBox.querySelectorAll(".item"));
    const githubItems = Array.from(githubBox.querySelectorAll(".item"));

    const gitItemIds = gitItems.map(i => i.id);
    const githubItemIds = githubItems.map(i => i.id);

    const gitCorrect = arraysEqual(gitItemIds.sort(), correctAnswers.git.sort());
    const githubCorrect = arraysEqual(githubItemIds.sort(), correctAnswers.github.sort());

    const result = document.getElementById("result");
    const nextBtn = document.getElementById("next-section-btn");

    result.classList.remove('success', 'error', 'show');
    void result.offsetWidth;

    if (gitCorrect && githubCorrect) {
        result.textContent = "כל הכבוד! כל התשובות נכונות ✅";
        result.classList.add('success', 'show');
        nextBtn.style.display = "block";
    } else {
        result.textContent = "יש טעויות, נסה שוב ❌";
        result.classList.add('error', 'show');
        nextBtn.style.display = "none";

        gitItems.forEach(item => {
            if (!correctAnswers.git.includes(item.id)) {
                item.classList.add("incorrect");
            } else {
                item.classList.remove("incorrect");
            }
        });

        githubItems.forEach(item => {
            if (!correctAnswers.github.includes(item.id)) {
                item.classList.add("incorrect");
            } else {
                item.classList.remove("incorrect");
            }
        });
    }
}


  function arraysEqual(a, b) {
    return JSON.stringify(a) === JSON.stringify(b);
  }

  function goToNext() {
    const urlParams = new URLSearchParams(window.location.search);
    const nextStep = "?step=2q" + (urlParams.has("accessible") ? "&accessible=1" : "");
    location.href = nextStep;
  }

  // Initialize the page
  document.addEventListener('DOMContentLoaded', function() {
    // Make sure all items are in the warehouse initially
    const warehouseContent = document.querySelector('#warehouse .zone-content');
    document.querySelectorAll('.item').forEach(item => {
      warehouseContent.appendChild(item);
    });
  });

  document.querySelectorAll(".item").forEach(item => {
  item.addEventListener("dragstart", () => {
    item.classList.remove("incorrect");
    });
  });
</script>

</body>
</html>
